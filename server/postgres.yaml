apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-postgres
  labels:
    app: dealership-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealership-postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dealership-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:13.2
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "gdLpFuRVTFAg9a793RNiBsE3"
        - name: POSTGRES_DB
          value: "postgres"
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - postgres
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-postgres
spec:
  type: ClusterIP
  selector:
    app: dealership-postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432