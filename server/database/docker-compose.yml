services:
  # Mongodb service
  mongo_db:
    container_name: db_container
    image: mongo:latest
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - 27017:27017
    restart: always
    volumes:
      - mongo_data:/data/db

  mongo_express:
    container_name: mongo_express_container
    image: mongo-express:latest
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo_db
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'false'
    ports:
      - 8081:8081
    restart: always
    depends_on:
      - mongo_db

  # Node api service
  api:
    image: nodeapp
    ports:
      - 3030:3030
    depends_on: 
      - mongo_db

volumes:
  mongo_data: {}
